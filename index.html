<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Revlon</title>
  <script src="https://cdn-widgetsrepository.yotpo.com/v1/loader/DiT8MV6qgPMCvwA1AFx5L3cOEMf0aAqNN0zzL9Xe?languageCode=en"  async></script>


<style>
  @import url("https://fonts.googleapis.com/css2?family=Roboto&display=swap");
  html{
    margin: 0 auto;
    max-width: 75%;
    min-height: 75vh;
    padding: 0 30px 10px;
    width: 100%;
  }
  .yotpo-base-layout{
    width: 100% !important;
  }
  .accordion-item .accordion-header{
    font-family: Roboto, sans-serif;
    color: #fff;
  }
  .logo{
    justify-self: center;
    padding: 30px 0 60px;
  }
  .template-header img{
    width: 350px;
    height: auto;
  }
  .accordion-item {
    border-bottom: 1px solid #ddd;
  }

  .accordion-header {
    cursor: pointer;
    
    padding: 15px;
    font-weight: 400;
    background: #2F84ED;
  }

  .accordion-content {
    display: none;
    padding: 15px;
  }

  .accordion-item.active .accordion-content {
    display: block;
  }
</style>

<body>
  
  <div class="template-header">
        <div class="logo">
          <img src="https://www.revlon.com/cdn/shop/files/revlon-logo.svg?v=1727897215&width=150">
        </div>
      </div>

     <div class="accordion-item">
    <div class="accordion-header">Review's Widget</div>
    <div class="accordion-content">
      <div class="yotpo-widget-instance"
           data-yotpo-instance-id="1281996"
           data-yotpo-product-id="{{product.id}}"
           data-yotpo-name="{{ product.title | escape }}"
           data-yotpo-url="{{ shop.url }}{{ product.url }}"
           data-yotpo-image-url="{{ product.featured_image | product_img_url:"large" |replace: '?', '%3F' | replace: '&','%26'}}"
           data-yotpo-description="{{ product.description | escape }}"
           mode-preview=true></div>
    </div>
  </div>

<div class="accordion-item">
    <div class="accordion-header">Q&A</div>
    <div class="accordion-content">
      <div class="yotpo-widget-instance"
           data-yotpo-instance-id="1281999"
           data-yotpo-product-id="{{product.id}}"
           data-yotpo-name="{{ product.title | escape }}"
           data-yotpo-url="{{ shop.url }}{{ product.url }}"
           data-yotpo-image-url="{{ product.featured_image | product_img_url:"large" |replace: '?', '%3F' | replace: '&','%26'}}"
           data-yotpo-description="{{ product.description | escape }}"
           mode-preview=true></div>
    </div>
  </div>
  
  <div class="accordion-item">
    <div class="accordion-header">Star Rating</div>
    <div class="accordion-content">
      <div class="yotpo-widget-instance"
           data-yotpo-instance-id="1281998"
           data-yotpo-product-id="{{product.id}}"
           data-yotpo-name="{{ product.title | escape }}"
           data-yotpo-url="{{ shop.url }}{{ product.url }}"
           data-yotpo-image-url="{{ product.featured_image | product_img_url:"large" |replace: '?', '%3F' | replace: '&','%26'}}"
           data-yotpo-description="{{ product.description | escape }}"
           mode-preview=true></div>
    </div>
  </div>

  <div class="accordion-item">
    <div class="accordion-header">Promote Products</div>
    <div class="accordion-content">
      <div class="yotpo-widget-instance"
           data-yotpo-instance-id="1287853"
           data-yotpo-product-id="{{product.id}}"
           data-yotpo-name="{{ product.title | escape }}"
           data-yotpo-url="{{ shop.url }}{{ product.url }}"
           data-yotpo-image-url="{{ product.featured_image | product_img_url:"large" |replace: '?', '%3F' | replace: '&','%26'}}"
           data-yotpo-description="{{ product.description | escape }}"
           mode-preview=true></div>
    </div>
  </div>

<script>
  document.querySelectorAll(".accordion-header").forEach(header => {
    header.addEventListener("click", function() {
      const item = this.parentElement;
      const isActive = item.classList.contains("active");

      // Close all items first
      document.querySelectorAll(".accordion-item").forEach(i => {
        i.classList.remove("active");
      });

      // If it wasn't active before, open it
      if (!isActive) {
        item.classList.add("active");
      }
    });
  });
</script>


</body>
